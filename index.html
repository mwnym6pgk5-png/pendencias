<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pendências — ADIGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00827E; --teal-soft:#e3f2f1;
    --vinho:#A32F3B; --vinho-soft:#f7e7e8;
    --roxo:#823174; --roxo-soft:#f1e4ef;
    --laranja:#c07a1f; --laranja-soft:#fbeedc;
    --adigo:#2f5d8a; --adigo-soft:#e6edf5;
    --cinza:#636A6B; --cinza-soft:#eef0f0;
    --bg:#faf9f7; --ink:#26302f; --card-bg:#ffffff; --border:#e4e2dd;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',sans-serif;padding:32px 24px 80px;}
  .wrap{max-width:1180px;margin:0 auto;}

  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--ink);}
  h1{font-family:'Exo 2',sans-serif;font-weight:800;font-size:32px;margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{color:var(--cinza);font-size:14px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sync-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--cinza-soft);color:var(--cinza);}
  .sync-status.ok{background:var(--teal-soft);color:var(--teal);}
  .sync-status.err{background:var(--vinho-soft);color:var(--vinho);}
  .gear-btn{border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--cinza);cursor:pointer;}
  .gear-btn:hover{border-color:var(--teal);color:var(--teal);}

  .progress-block{min-width:240px;text-align:right;}
  .progress-count{font-family:'Exo 2',sans-serif;font-weight:700;font-size:22px;}
  .progress-count span{color:var(--teal);}
  .bar-track{width:240px;height:8px;border-radius:99px;background:var(--cinza-soft);overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;background:var(--teal);width:0%;transition:width .35s ease;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .chip{font-family:'Open Sans',sans-serif;font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--cinza);cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--teal);color:var(--teal);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .action-btn{margin-left:auto;font-family:'Open Sans',sans-serif;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--vinho);background:var(--vinho-soft);color:var(--vinho);cursor:pointer;}
  .action-btn:hover{background:var(--vinho);color:#fff;}
  .new-card-btn{font-family:'Open Sans',sans-serif;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:99px;border:1.5px dashed var(--teal);background:var(--teal-soft);color:var(--teal);cursor:pointer;}
  .new-card-btn:hover{background:var(--teal);color:#fff;}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:24px;font-size:12.5px;color:var(--cinza);}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;}

  .card{background:var(--card-bg);border:1px solid var(--border);border-left:5px solid var(--cat-color);border-radius:10px;padding:18px 18px 14px;display:flex;flex-direction:column;transition:opacity .2s;}
  .card.done{opacity:.55;}
  .card.overdue{box-shadow:0 0 0 1px var(--vinho) inset;}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:8px;}
  .card-title{font-family:'Exo 2',sans-serif;font-weight:700;font-size:16px;margin:0;}
  .card-tag-row{display:flex;align-items:center;gap:6px;}
  .card-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--cat-color);white-space:nowrap;border:none;background:transparent;cursor:pointer;font-family:'Open Sans',sans-serif;}
  .card-tag:hover{text-decoration:underline;}
  .card-del{background:none;border:none;color:var(--cinza);cursor:pointer;font-size:14px;padding:0 2px;opacity:.5;}
  .card-del:hover{opacity:1;color:var(--vinho);}
  .card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .card-progress{font-size:11.5px;color:var(--cinza);font-weight:600;}
  .next-due{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .next-due.overdue{background:var(--vinho-soft);color:var(--vinho);}
  .next-due.today{background:var(--laranja-soft);color:var(--laranja);}
